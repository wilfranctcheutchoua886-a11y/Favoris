<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test 2</title>
<style>body{font:15px sans-serif;background:#0b1220;color:#e6edf7;padding:14px}button{font-size:17px;padding:12px 16px;border:0;border-radius:12px;background:#3b82f6;color:#fff;width:100%}pre{white-space:pre-wrap;word-break:break-word;background:#131c2e;padding:10px;border-radius:10px;font-size:12px}</style></head>
<body>
<h3>Test 2 : chargement football complet</h3>
<button id="b">Lancer (≈ 40 s)</button>
<pre id="o">En attente…</pre>
<script src="moteur.js"></script>
<script>
var o = document.getElementById('o');
function log(t) { o.textContent += '\n' + t; }
var vf = window.fetch.bind(window);
window.fetch = async function (u, p) {
  var t0 = Date.now(), r = await vf(u, p), c = '';
  try { c = (await r.clone().text()).slice(0, 220); } catch (e) {}
  if (String(u).indexOf('api-sports') > -1) log('→ ' + String(u).replace(/^https:\/\/[^/]+/, '') + '\n   HTTP ' + r.status + ' (' + (Date.now() - t0) + ' ms)\n   ' + c);
  return r;
};
document.getElementById('b').onclick = async function () {
  o.textContent = 'Clé : ' + ((PM.g('cleaf', '') || '').length) + ' caractères';
  try {
    var c = await PM.charger('foot', PM.jour(0), true, function (t) { log('… ' + t); });
    log('\nRÉSULTAT : ' + c.m.length + ' match(s) analysé(s)');
  } catch (e) { log('\nERREUR FINALE : ' + e.message); }
};
</script></body></html>
